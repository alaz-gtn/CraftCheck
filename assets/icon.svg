<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f6e"/>
      <stop offset="1" stop-color="#120820"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#a335ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a335ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe083"/>
      <stop offset="0.5" stop-color="#e6a800"/>
      <stop offset="1" stop-color="#9a6600"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="1" stop-color="#b07a00"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cffb0"/>
      <stop offset="1" stop-color="#1fbf6a"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#glow)"/>
  <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="url(#goldEdge)" stroke-width="2.2" opacity="0.9"/>

  <!-- Chispas -->
  <g fill="#ffe083" opacity="0.9">
    <circle cx="26" cy="22" r="1.6"/>
    <circle cx="70" cy="16" r="1.2"/>
    <circle cx="80" cy="30" r="1.0"/>
    <circle cx="18" cy="40" r="0.9"/>
  </g>

  <!-- Yunque -->
  <g stroke="#1a0c2e" stroke-width="1.6" stroke-linejoin="round">
    <!-- cara superior con cuerno -->
    <path d="M26 33 L74 33 Q80 33 82 37 L82 45 L26 45 Q18 45 8 40 Q18 35 26 33 Z" fill="url(#gold)"/>
    <!-- cintura -->
    <path d="M40 45 L64 45 L60 58 L44 58 Z" fill="#c88f00"/>
    <!-- base -->
    <path d="M30 58 L74 58 L78 66 L26 66 Z" fill="url(#gold)"/>
    <!-- pie -->
    <rect x="22" y="66" width="60" height="7" rx="2.5" fill="#8a5c00"/>
  </g>
  <!-- brillo cara -->
  <path d="M28 35 L72 35 L72 37 L28 37 Z" fill="#fff6c8" opacity="0.6"/>

  <!-- Tick -->
  <path d="M52 63 L66 77 L92 47" fill="none" stroke="#120820" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 63 L66 77 L92 47" fill="none" stroke="url(#green)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
